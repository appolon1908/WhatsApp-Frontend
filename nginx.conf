limit_req_zone $binary_remote_addr zone=policy_validation:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Only non-effectful health and readiness GETs are exposed.
    location = /api/healthz { limit_except GET { deny all; } proxy_pass http://whatsapp-api:8782/healthz; proxy_read_timeout 8s; }
    location = /api/readyz { limit_except GET { deny all; } proxy_pass http://whatsapp-api:8782/readyz; proxy_read_timeout 8s; }
    location = /adapter/healthz { limit_except GET { deny all; } proxy_pass http://evolution-adapter:8781/healthz; proxy_read_timeout 8s; }
    location = /adapter/readyz { limit_except GET { deny all; } proxy_pass http://evolution-adapter:8781/readyz; proxy_read_timeout 8s; }

    # Validation is deterministic and non-persistent: never proxy commands,
    # provider operations, webhooks, conversation data, or administrative APIs.
    location = /api/contacts/eligibility {
        if ($request_method != POST) { return 405; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://whatsapp-api:8782/platform/v1/whatsapp/contacts/eligibility;
        proxy_read_timeout 8s;
    }
    location = /api/campaigns/validate {
        if ($request_method != POST) { return 405; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://whatsapp-api:8782/platform/v1/whatsapp/campaigns/validate;
        proxy_read_timeout 8s;
    }
    location ^~ /api/ { return 404; }
    location ^~ /adapter/ { return 404; }
    location ~ /[.] { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
