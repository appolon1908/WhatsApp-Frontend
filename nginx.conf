server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = /api/healthz { proxy_pass http://whatsapp-api:8782/healthz; proxy_read_timeout 8s; }
    location = /api/readyz { proxy_pass http://whatsapp-api:8782/readyz; proxy_read_timeout 8s; }
    location = /adapter/healthz { proxy_pass http://evolution-adapter:8781/healthz; proxy_read_timeout 8s; }
    location ^~ /api/ { return 404; }
    location ^~ /adapter/ { return 404; }
    location ~ /[.] { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
