limit_req_zone $binary_remote_addr zone=policy_validation:10m rate=5r/s;

# Do not forward the public Caddy Basic Auth secret to the API.
# Only Keycloak-issued Bearer access tokens may reach the phone-admin service.
map $http_authorization $phone_admin_bearer {
    default "";
    ~^Bearer[[:space:]]+[A-Za-z0-9_.-]+$ $http_authorization;
}


server {
    listen 8080;
    server_name _;
    # Docker service IPs may change after container recreation.
    # Resolve through Docker DNS dynamically instead of caching the first IP at Nginx startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $whatsapp_backend "whatsapp-api:8782";
    set $provider_backend "evolution-adapter:8781";
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Only non-effectful health and readiness GETs are exposed.
    location = /api/healthz { limit_except GET { deny all; } proxy_pass http://$whatsapp_backend/healthz; proxy_read_timeout 8s; }
    location = /api/readyz { limit_except GET { deny all; } proxy_pass http://$whatsapp_backend/readyz; proxy_read_timeout 8s; }
    location = /adapter/healthz { limit_except GET { deny all; } proxy_pass http://$provider_backend/healthz; proxy_read_timeout 8s; }
    location = /adapter/readyz { limit_except GET { deny all; } proxy_pass http://$provider_backend/readyz; proxy_read_timeout 8s; }

    # Validation is deterministic and non-persistent: never proxy commands,
    # provider operations, webhooks, conversation data, or administrative APIs.
    location = /api/contacts/eligibility {
        if ($request_method != POST) { return 405; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://$whatsapp_backend/platform/v1/whatsapp/contacts/eligibility;
        proxy_read_timeout 8s;
    }
    location = /api/campaigns/validate {
        if ($request_method != POST) { return 405; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://$whatsapp_backend/platform/v1/whatsapp/campaigns/validate;
        proxy_read_timeout 8s;
    }
    # The browser requests only public OIDC client configuration, never a secret.
    location = /api/phone-auth-config {
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://$whatsapp_backend/internal/v1/whatsapp/phone-auth-config;
        proxy_read_timeout 8s;
    }
    location = /api/phone-readiness {
        limit_except GET { deny all; }
        proxy_set_header Cookie "";
        proxy_set_header Authorization $phone_admin_bearer;
        proxy_pass http://$whatsapp_backend/internal/v1/whatsapp/phone-readiness;
        proxy_read_timeout 8s;
    }
    # Phone account registry requires independent server-side administrator token and tenant.
    # Never inject or log an administrator secret in this proxy configuration.
    location = /api/phone-accounts {
        limit_except GET POST { deny all; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Authorization $phone_admin_bearer;
        proxy_set_header Cookie "";
        proxy_pass http://$whatsapp_backend/internal/v1/whatsapp/phone-accounts;
        proxy_read_timeout 12s;
    }
    location ^~ /api/phone-accounts/ {
        limit_except GET POST PATCH { deny all; }
        limit_req zone=policy_validation burst=10 nodelay;
        proxy_set_header Authorization $phone_admin_bearer;
        proxy_set_header Cookie "";
        proxy_pass http://$whatsapp_backend/internal/v1/whatsapp/phone-accounts/;
        proxy_read_timeout 12s;
    }
    location ^~ /api/ { return 404; }
    location ^~ /adapter/ { return 404; }
    location ~ /[.] { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
